<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleFood - Vendor Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Top Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <span class="navbar-brand fw-bold">TeleFood Vendor</span>

        <div class="d-flex align-items-center gap-3">
            <!-- Displays who is logged in -->
            <span class="text-light">
                    Logged in as: <strong id="vendorNameDisplay">Loading...</strong>
                </span>

            <!-- Leads to the Update Information page -->
            <a href="update-vendor.html" id="updateInfoBtn" class="btn btn-outline-light btn-sm">
                Update Information
            </a>

            <!-- Logs out and leads back to index.html -->
            <button id="logoutBtn" class="btn btn-danger btn-sm" onclick="handleLogout()">
                Logout
            </button>
        </div>
    </div>
</nav>

<div class="container pb-5">

    <!-- Live WebSocket Notification Banner (hidden by default) -->
    <div id="wsNotificationBox" class="alert alert-info alert-dismissible fade show d-none" role="alert">
        <span id="wsNotificationText"></span>
        <button type="button" class="btn-close" onclick="hideNotification()"></button>
    </div>

    <!-- General Error / Status Message Box (hidden by default) -->
    <div id="messageBox" class="alert d-none" role="alert"></div>

    <!-- First Half: Active Orders Section -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Active Orders</h5>
            <button class="btn btn-light btn-sm" onclick="loadVendorOrders()">Refresh</button>
        </div>
        <div class="card-body">
            <p id="noActiveOrdersText" class="text-muted mb-0">No active orders at the moment.</p>
            <!-- JS will inject clickable active order cards inside this div -->
            <div id="activeOrdersContainer" class="row g-3"></div>
        </div>
    </div>

    <!-- Second Half: Completed Orders Section -->
    <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white">
            <h5 class="mb-0">Completed Orders</h5>
        </div>
        <div class="card-body">
            <p id="noCompletedOrdersText" class="text-muted mb-0">No completed orders yet.</p>
            <!-- JS will inject clickable completed order cards inside this div -->
            <div id="completedOrdersContainer" class="row g-3"></div>
        </div>
    </div>

</div>

<!-- SockJS and STOMP.js libraries for WebSocket notifications -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<!-- External Vendor JS file -->
<script src="vendor.js"></script>
</body>
</html>
