<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleFood - Register</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center py-5">

<div class="card shadow-sm p-4" style="width: 100%; max-width: 500px;">
    <h3 class="text-center mb-4">Create an Account</h3>

    <!-- Alert box for errors or success messages -->
    <div id="messageBox" class="alert d-none" role="alert"></div>

    <!-- Role Selector -->
    <div class="mb-3">
        <label for="roleSelect" class="form-label fw-bold">Register as</label>
        <select class="form-select" id="roleSelect" onchange="toggleRoleFields()">
            <option value="customer" selected>Customer</option>
            <option value="vendor">Vendor (Store)</option>
            <option value="courier">Courier</option>
        </select>
    </div>

    <!-- First & Last Name -->
    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="firstNameInput" class="form-label">First Name</label>
            <input type="text" class="form-control" id="firstNameInput" placeholder="First name" required>
        </div>
        <div class="col-md-6 mb-3">
            <label for="lastNameInput" class="form-label">Last Name</label>
            <input type="text" class="form-control" id="lastNameInput" placeholder="Last name" required>
        </div>
    </div>

    <!-- Email & Password -->
    <div class="mb-3">
        <label for="emailInput" class="form-label">Email</label>
        <input type="email" class="form-control" id="emailInput" placeholder="Enter your email" required>
    </div>

    <div class="mb-3">
        <label for="passwordInput" class="form-label">Password</label>
        <input type="password" class="form-control" id="passwordInput" placeholder="Create a password" required>
    </div>

    <!-- Phone Number -->
    <div class="mb-3">
        <label for="phoneInput" class="form-label">Phone Number</label>
        <input type="tel" class="form-control" id="phoneInput" placeholder="Enter your phone number" required>
    </div>

    <!-- Location Fields (Country, City, Address) -->
    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="countryInput" class="form-label">Country</label>
            <input type="text" class="form-control" id="countryInput" placeholder="Country" required>
        </div>
        <div class="col-md-6 mb-3">
            <label for="cityInput" class="form-label">City</label>
            <input type="text" class="form-control" id="cityInput" placeholder="City" required>
        </div>
    </div>

    <div class="mb-3">
        <label for="addressInput" class="form-label">Address</label>
        <input type="text" class="form-control" id="addressInput" placeholder="Street and number" required>
    </div>

    <!-- Shared Extra Field for Vendor & Courier: TIN (hidden by default for Customer) -->
    <div id="tinGroup" class="mb-3 d-none">
        <label for="tinInput" class="form-label">TIN (Tax Identification Number)</label>
        <input type="text" class="form-control" id="tinInput" placeholder="Enter your TIN">
    </div>

    <!-- Extra Fields for Vendor Only: Store Name & Description (hidden by default) -->
    <div id="vendorGroup" class="d-none">
        <div class="mb-3">
            <label for="vendorNameInput" class="form-label">Store Name</label>
            <input type="text" class="form-control" id="vendorNameInput" placeholder="Enter your store name">
        </div>
        <div class="mb-3">
            <label for="descriptionInput" class="form-label">Store Description</label>
            <textarea class="form-control" id="descriptionInput" rows="2" placeholder="Describe your store"></textarea>
        </div>
    </div>

    <!-- Register Button -->
    <button id="registerBtn" class="btn btn-primary w-100 mb-3" onclick="handleRegister()">
        Register
    </button>

    <div class="text-center">
        <small class="text-muted">Already have an account? <a href="index.html">Log in here</a></small>
    </div>
</div>

<!-- External JS file -->
<script src="register.js"></script>
</body>
</html>
